name: caatuu

x-animated-fabric-cutout-runtime: &animated-fabric-cutout-runtime
  working_dir: /work
  environment: &animated-fabric-cutout-environment
    ANIMATED_FABRIC_MODEL_CACHE: /models/huggingface/hub
    DO_NOT_TRACK: "1"
    HF_HOME: /models/huggingface
    HF_HUB_CACHE: /models/huggingface/hub
    HF_HUB_DISABLE_TELEMETRY: "1"
    HF_HUB_OFFLINE: "1"
    HF_MODULES_CACHE: /tmp/huggingface/modules
    TRANSFORMERS_OFFLINE: "1"
  network_mode: none
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
  volumes:
    - ./apps/animated-fabric/workspaces/cutout/input:/input:ro
    - ./apps/animated-fabric/workspaces/cutout/output:/output
    - animated-fabric-cutout-models:/models:ro
  init: true

services:
  caatuu:
    profiles:
      - local
    build:
      context: .
      dockerfile: apps/server/tooling/Dockerfile
    image: caatuu-runtime:debian-latest
    container_name: caatuu
    working_dir: /workspace/apps/server
    environment:
      CAATUU_WORKSPACE_ROOT: /workspace
      BIND_ADDR: "0.0.0.0"
      PORT: "9172"
      RUST_LOG: ${CAATUU_RUST_LOG:-info}
      ENABLE_ANDROID_DEBUG_DOWNLOADS: ${CAATUU_ENABLE_ANDROID_DEBUG_DOWNLOADS:-0}
      ENABLE_BUG_REPORTS: ${CAATUU_ENABLE_BUG_REPORTS:-0}
      ENABLE_CAATUU_GAME_PREVIEW: ${CAATUU_ENABLE_CAATUU_GAME_PREVIEW:-1}
      DICTIONARY_GAP_STORE_PATH: /var/lib/caatuu/dictionary-gaps/czech-missing-words.v1.json
    ports:
      - "127.0.0.1:8765:9172"
    volumes:
      - ./apps/language-runtime:/workspace/apps/language-runtime:ro
      - ./apps/languages:/workspace/apps/languages:ro
      - ./apps/launcher/static:/workspace/apps/launcher/static:ro
      - ./artifacts/android:/workspace/artifacts/android:ro
      - ./artifacts/games:/workspace/artifacts/games:ro
      - ./artifacts/dictionary-gaps:/var/lib/caatuu/dictionary-gaps
      - ./apps/android/tooling/termux-install-debug.sh:/workspace/apps/android/tooling/termux-install-debug.sh:ro
    command:
      - bash
      - -lc
      - |
        set -Eeuo pipefail
        node /workspace/apps/language-runtime/tooling/verify-embedding-runtime.mjs
        exec /usr/local/bin/caatuu-runtime
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-9172}/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"

  caatuu-build:
    image: rust:1.96-bookworm
    profiles:
      - tools
    working_dir: /workspace/apps/server
    environment:
      CARGO_TARGET_DIR: /workspace/apps/server/target-linux
    volumes:
      - .:/workspace
      - caatuu-cargo-registry:/usr/local/cargo/registry
      - caatuu-cargo-git:/usr/local/cargo/git
    command: ["cargo", "build", "--release", "--locked"]

  caatuu-dev:
    build:
      context: ./tools/dev-container
      dockerfile: Dockerfile
    image: caatuu-dev:debian-latest
    container_name: caatuu-dev
    profiles:
      - dev
    working_dir: /workspace
    environment:
      HF_HOME: /workspace/tools/czech-ml/data/models/english-base/hf-cache
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      CAATUU_REQUIRE_NVIDIA: "0"
      QT_QPA_PLATFORM: offscreen
    volumes:
      - .:/workspace
      - caatuu-cargo-registry:/usr/local/cargo/registry
      - caatuu-cargo-git:/usr/local/cargo/git
      - caatuu-npm-cache:/root/.npm
      - caatuu-pip-cache:/root/.cache/pip
      - caatuu-android-sdk:/opt/android-sdk
      - caatuu-gradle-dist:/opt/gradle
      - caatuu-gradle-cache:/root/.gradle
    stdin_open: true
    tty: true
    command: ["bash"]

  caatuu-game-godot-provision:
    profiles:
      - game-tools-provision
    platform: linux/amd64
    build:
      context: ./apps/games/caatuu-game
      dockerfile: tooling/Dockerfile
      target: godot-provisioner
    image: caatuu-game-godot-provision:4.7.1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - caatuu-godot-web-toolchain-4-7-1:/toolchain
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 128
    init: true

  caatuu-game-godot-export:
    profiles:
      - game-tools
    platform: linux/amd64
    build:
      context: ./apps/games/caatuu-game
      dockerfile: tooling/Dockerfile
      target: godot-exporter
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-game-godot-export:4.7.1
    working_dir: /work
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
      - /work:rw,noexec,nosuid,nodev,size=1g,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
    volumes:
      - ./apps/games/caatuu-game:/project:ro
      - ./apps/launcher/static/assets/scenery:/scenery-source:ro
      - ./apps/launcher/static/assets/motion/quaternius-standard-v1/source:/reference:ro
      - ./apps/animated-fabric/assets/reference-packages/macaw-traveler-v1:/macaw-reference:ro
      - ./artifacts/games/caatuu-game/web/godot-v1:/output
      - caatuu-godot-web-toolchain-4-7-1:/toolchain:ro
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    init: true

  animated-fabric-cutout-classic:
    <<: *animated-fabric-cutout-runtime
    profiles:
      - cutout-classic
    build:
      context: ./apps/animated-fabric
      dockerfile: Dockerfile.cutout
      target: cutout-core
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-animated-fabric-cutout:core-py312
    container_name: caatuu-animated-fabric-cutout-classic
    command: ["doctor"]

  animated-fabric-cutout:
    <<: *animated-fabric-cutout-runtime
    profiles:
      - cutout
    build:
      context: ./apps/animated-fabric
      dockerfile: Dockerfile.cutout
      target: cutout-cpu
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-animated-fabric-cutout:cpu-py312
    container_name: caatuu-animated-fabric-cutout
    command: ["doctor"]

  animated-fabric-cutout-cuda:
    <<: *animated-fabric-cutout-runtime
    profiles:
      - cutout-cuda
    build:
      context: ./apps/animated-fabric
      dockerfile: Dockerfile.cutout
      target: cutout-cuda
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-animated-fabric-cutout:cuda12.8-py312
    container_name: caatuu-animated-fabric-cutout-cuda
    gpus: all
    command: ["doctor"]

  animated-fabric-cutout-prefetch:
    profiles:
      - cutout-provision
    build:
      context: ./apps/animated-fabric
      dockerfile: Dockerfile.cutout
      target: cutout-cpu
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-animated-fabric-cutout:cpu-py312
    container_name: caatuu-animated-fabric-cutout-prefetch
    working_dir: /work
    environment:
      <<: *animated-fabric-cutout-environment
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
    volumes:
      - animated-fabric-cutout-models:/models
    init: true
    command: ["prefetch"]

  animated-fabric-blender:
    profiles:
      - blender
    platform: linux/amd64
    build:
      context: ./apps/animated-fabric
      dockerfile: containers/blender/Dockerfile
      target: directional-worker
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-animated-fabric-blender:4.5.12-cycles-cpu
    container_name: caatuu-animated-fabric-blender
    working_dir: /work
    environment:
      ANIMATED_FABRIC_BLENDER_OUTPUT_ROOT: /output
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
    volumes:
      - ./apps/animated-fabric/workspaces/blender:/output
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 256
    shm_size: 512m
    init: true
    command: ["--out", "/output/af053-demo"]

  animated-fabric-blender-actor-validator:
    profiles:
      - blender-actor
    platform: linux/amd64
    build:
      context: ./apps/animated-fabric
      dockerfile: containers/blender/Dockerfile
      target: actor-validator
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-animated-fabric-blender-actor-validator:4.5.12
    container_name: caatuu-animated-fabric-blender-actor-validator
    working_dir: /work
    environment:
      ANIMATED_FABRIC_BLENDER_OUTPUT_ROOT: /output
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
    volumes:
      - ./apps/animated-fabric/workspaces/actor-packages/geometric-fixture-v1:/actor-package:ro
      - ./apps/animated-fabric/workspaces/blender:/output
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 256
    shm_size: 512m
    init: true
    command: ["--out", "/output/af055-neutral"]

  animated-fabric-blender-macaw-actor-validator:
    profiles:
      - blender-macaw
    platform: linux/amd64
    build:
      context: ./apps/animated-fabric
      dockerfile: containers/blender/Dockerfile
      target: macaw-actor-validator
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-animated-fabric-blender-macaw-actor-validator:4.5.12
    container_name: caatuu-animated-fabric-blender-macaw-actor-validator
    working_dir: /work
    environment:
      ANIMATED_FABRIC_BLENDER_OUTPUT_ROOT: /output
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
    volumes:
      - ./apps/animated-fabric/assets/actor-packages/macaw-traveler-avian-v1/package:/actor-package:ro
      - ./apps/animated-fabric/workspaces/blender:/output
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 256
    shm_size: 512m
    init: true
    command: ["--out", "/output/af056-review"]

  animated-fabric-3d-lab:
    profiles:
      - reconstruction
    platform: linux/amd64
    build:
      context: ./apps/animated-fabric
      dockerfile: containers/reconstruction/Dockerfile
      target: triposr-runtime
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-animated-fabric-3d-lab:triposr-0.1
    container_name: caatuu-animated-fabric-3d-lab
    working_dir: /work
    environment:
      ANIMATED_FABRIC_MODEL_CACHE: /models/huggingface/hub
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_CACHE: /tmp/transformers
      TRANSFORMERS_OFFLINE: "1"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
    volumes:
      - ./apps/animated-fabric/workspaces/reconstruction/input:/input:ro
      - ./apps/animated-fabric/workspaces/reconstruction/output:/output
      - animated-fabric-reconstruction-models:/models:ro
    gpus: all
    cpus: 12.0
    mem_limit: 24g
    pids_limit: 512
    shm_size: 1g
    init: true
    command: ["doctor"]

  animated-fabric-3d-lab-provision:
    profiles:
      - reconstruction-provision
    platform: linux/amd64
    build:
      context: ./apps/animated-fabric
      dockerfile: containers/reconstruction/Dockerfile
      target: model-provisioner
      args:
        APP_GID: ${LOCAL_GID:-1000}
        APP_UID: ${LOCAL_UID:-1000}
    image: caatuu-animated-fabric-3d-lab-provision:hub-1.22.0
    container_name: caatuu-animated-fabric-3d-lab-provision
    working_dir: /work
    environment:
      ANIMATED_FABRIC_CHECKPOINT_STAGING: /staging
      ANIMATED_FABRIC_MODEL_CACHE: /models/huggingface/hub
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_HUB_OFFLINE: "0"
      HF_XET_HIGH_PERFORMANCE: "1"
      TRANSFORMERS_OFFLINE: "0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
    volumes:
      - animated-fabric-reconstruction-models:/models
      - animated-fabric-reconstruction-direct-staging:/staging
    cpus: 4.0
    mem_limit: 8g
    pids_limit: 256
    init: true

volumes:
  caatuu-cargo-registry:
  caatuu-cargo-git:
  caatuu-npm-cache:
  caatuu-pip-cache:
  caatuu-android-sdk:
    name: caatuu-android-sdk
  caatuu-gradle-dist:
    name: caatuu-gradle-dist
  caatuu-gradle-cache:
    name: caatuu-gradle-cache
  caatuu-godot-web-toolchain-4-7-1:
    name: caatuu-godot-web-toolchain-4-7-1
  animated-fabric-cutout-models:
    name: caatuu-animated-fabric-cutout-models
  animated-fabric-reconstruction-models:
    name: caatuu-animated-fabric-reconstruction-models
  animated-fabric-reconstruction-direct-staging:
    name: caatuu-animated-fabric-reconstruction-direct-staging
