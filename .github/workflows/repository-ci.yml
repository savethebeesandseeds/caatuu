name: Repository CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Structure and browser contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Check repository structure and documentation links
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace node:24-bookworm \
            bash -lc \
            "node tools/repository/check-tracked-files.mjs && node tools/repository/check-markdown-links.mjs"

      - name: Run browser and server contract tests
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace node:24-bookworm \
            bash -lc '
              set -euo pipefail
              mapfile -t tests < <(
                find apps/server/tooling/tests apps/games/test apps/android/tooling/tests apps/launcher/tooling/tests apps/reporting-worker/tests \
                  -type f -name "*.test.mjs" \
                  ! -path "apps/launcher/tooling/tests/static-site-contract.test.mjs" \
                  | sort
              )
              # Full asset compilers share substantial catalog and image buffers.
              # Bound their overlap on the runner and retain child-exit diagnostics.
              node --test --test-concurrency=1 --test-reporter=tap "${tests[@]}"
            '

      - name: Exercise Android release failure and resume behavior without publication
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          ./apps/android/tooling/tests/release-orchestration.test.ps1
          ./apps/android/tooling/tests/release-network-retry.test.ps1

      - name: Restore pinned shared runtime files for contract tests
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r path url bytes sha256; do
            destination="apps/language-runtime/$path"
            [[ -f "$destination" ]] && continue
            mkdir -p "$(dirname -- "$destination")"
            temporary="${destination}.ci-download"
            curl --fail --show-error --silent --location --retry 3 \
              "https://caatuu.waajacu.com$url" --output "$temporary"
            [[ "$(stat -c %s "$temporary")" == "$bytes" ]]
            printf '%s  %s\n' "$sha256" "$temporary" | sha256sum --check --status
            mv -- "$temporary" "$destination"
          done < <(jq -r '.runtimes[].artifacts[] | [.path, .url, .bytes, .sha256] | @tsv' apps/language-runtime/embedding-runtimes.json)

      - name: Validate language content and deterministic Word World projections
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace node:24-bookworm \
            bash -lc \
            "node tools/language-packs/restore-ci-runtime.mjs && node tools/language-content/validate.mjs && node tools/language-content/quality/content-progression-catalogs.mjs && node tools/language-content/project-word-world-runtime.mjs --check && node apps/server/tooling/refresh-setup-assets.mjs --all-browser-courses --check && node --test apps/language-runtime/tests/*.test.mjs apps/languages/*/tests/*.test.mjs tools/language-content/tests/*.test.mjs tools/language-content/quality/content-progression-catalogs.test.mjs tools/language-packs/tests/*.test.mjs tools/learning-evaluation/policy/*.test.mjs tools/learning-evaluation/content/*.test.mjs tools/semantic-index/tests/*.test.mjs tools/czech-ml/tests/*.test.mjs"

      - name: Validate Compose boundaries
        if: github.event_name == 'workflow_dispatch'
        env:
          CAATUU_PHONE_DEBUG_BIND: 192.0.2.10
        run: |
          docker compose config --quiet
          docker compose --profile tools --profile dev config --quiet
          docker compose -f compose.yaml -f compose/dev-gpu.yaml --profile dev config --quiet
          docker compose -f compose.yaml -f compose/phone-debug.yaml config --quiet

  rust:
    name: Rust server
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run locked Rust tests in the repository container
        run: |
          docker compose --profile tools run --rm \
            caatuu-build cargo test --locked

  scenery-evidence:
    name: Scenery package evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify hashes, byte lengths, and PNG dimensions
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace node:24-bookworm \
            node --test apps/games/evidence/scenery-package-evidence.test.mjs

  static-site-evidence:
    name: Static Pages build evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Compile twice and validate the closed Pages payload
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace node:24-bookworm \
            node --test apps/launcher/tooling/tests/static-site-contract.test.mjs
