name: Repository CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Structure and browser contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check repository structure and documentation links
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace node:24-bookworm \
            bash -lc \
            "node tools/repository/check-tracked-files.mjs && node tools/repository/check-markdown-links.mjs"

      - name: Run browser and server contract tests
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace node:24-bookworm \
            bash -lc \
            "node --test apps/server/tooling/tests/*.test.mjs apps/games/test/*.test.mjs apps/android/tooling/tests/*.test.mjs apps/languages/czech/test/*.test.mjs"

      - name: Validate reviewed game data and the retired curriculum boundary
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace node:24-bookworm \
            bash -lc \
            "node --test apps/server/tooling/tests/conjugation-comet-shell.test.mjs apps/server/tooling/tests/curriculum-runtime-contract.test.mjs apps/server/tooling/tests/guided-game-contract.test.mjs apps/server/tooling/tests/word-net-standard.test.mjs"

      - name: Validate Compose boundaries
        env:
          CAATUU_PHONE_DEBUG_BIND: 192.0.2.10
        run: |
          docker compose config --quiet
          docker compose --profile tools --profile dev config --quiet
          docker compose -f compose.yaml -f compose/dev-gpu.yaml --profile dev config --quiet
          docker compose -f compose.yaml -f compose/dev-gui.yaml --profile dev config --quiet
          docker compose -f compose.yaml -f compose/archived-chinese.yaml config --quiet
          docker compose -f compose.yaml -f compose/phone-debug.yaml config --quiet

  rust:
    name: Rust server
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run locked Rust tests in the repository container
        run: |
          docker compose --profile tools run --rm \
            caatuu-build cargo test --locked
