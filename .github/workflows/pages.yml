name: Deploy static Caatuu to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact pushed main commit that is authorized for this deployment
        required: true
        type: string
      allow_http_certificate_bootstrap:
        description: Allow one deployment while GitHub provisions custom-domain HTTPS
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build reviewed static site
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out main without retained credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce the main-only repository policy
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_REVISION" ]]
          [[ "$(git branch --show-current)" == "main" ]]
          mapfile -t local_heads < <(git for-each-ref --format='%(refname:strip=2)' refs/heads)
          mapfile -t remote_heads < <(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" | sed 's#.*refs/heads/##')
          if (( ${#local_heads[@]} != 1 )) || [[ "${local_heads[0]-}" != "main" ]]; then
            printf 'Expected only local main; found: %s\n' "${local_heads[*]-<none>}" >&2
            exit 1
          fi
          if (( ${#remote_heads[@]} != 1 )) || [[ "${remote_heads[0]-}" != "main" ]]; then
            printf 'Expected only remote main; found: %s\n' "${remote_heads[*]-<none>}" >&2
            exit 1
          fi
          [[ "$(git worktree list --porcelain | grep -c '^worktree ')" == "1" ]]

      - name: Enforce the complete append-only Android release history
        shell: bash
        env:
          RELEASE_DESCRIPTOR: apps/android/tooling/pages-current-release.json
          HISTORY_DIR: artifacts/android/pages-input/release-history
        run: |
          set -euo pipefail
          [[ ! -e "$HISTORY_DIR" && ! -L "$HISTORY_DIR" ]]
          ancestor="$(dirname -- "$HISTORY_DIR")"
          while [[ "$ancestor" != "." ]]; do
            [[ ! -L "$ancestor" ]]
            ancestor="$(dirname -- "$ancestor")"
          done
          mkdir -p -- "$HISTORY_DIR"
          [[ -d "$HISTORY_DIR" && ! -L "$HISTORY_DIR" ]]
          mapfile -t descriptor_commits < <(git rev-list --first-parent --reverse HEAD -- "$RELEASE_DESCRIPTOR")
          (( ${#descriptor_commits[@]} > 0 ))
          v2_snapshots=()
          for commit in "${descriptor_commits[@]}"; do
            [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
            snapshot="$HISTORY_DIR/${commit}.json"
            git show "${commit}:${RELEASE_DESCRIPTOR}" > "$snapshot"
            [[ -f "$snapshot" && ! -L "$snapshot" ]]
            schema_version="$(jq -er '.schemaVersion' "$snapshot")"
            if [[ "$schema_version" == "2" ]]; then
              v2_snapshots+=("$snapshot")
            fi
          done
          (( ${#v2_snapshots[@]} > 0 ))
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            node:24-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2 \
            node apps/android/tooling/pages-current-release.mjs download-plan \
              --descriptor "${v2_snapshots[0]}" >/dev/null
          for (( index = 1; index < ${#v2_snapshots[@]}; index += 1 )); do
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE:/workspace:ro" \
              --workdir /workspace \
              node:24-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2 \
              node apps/android/tooling/pages-current-release.mjs assert-prefix \
                --previous-descriptor "${v2_snapshots[index - 1]}" \
                --next-descriptor "${v2_snapshots[index]}"
          done
          cmp -- "${v2_snapshots[-1]}" "$RELEASE_DESCRIPTOR"

      - name: Read configured Pages metadata without enabling Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: false

      - name: Require the production custom domain at the origin root
        shell: bash
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ALLOW_HTTP_CERTIFICATE_BOOTSTRAP: ${{ inputs.allow_http_certificate_bootstrap }}
        run: |
          set -euo pipefail
          expected='https://caatuu.waajacu.com'
          if [[ "$ALLOW_HTTP_CERTIFICATE_BOOTSTRAP" == "true" ]]; then
            bootstrap_expected='http://caatuu.waajacu.com'
            [[ "$PAGES_ORIGIN" == "$expected" || "$PAGES_ORIGIN" == "$bootstrap_expected" ]]
            [[ "$PAGES_BASE_URL" == "$PAGES_ORIGIN" ]]
          else
            [[ "$PAGES_ORIGIN" == "$expected" ]]
            [[ "$PAGES_BASE_URL" == "$expected" ]]
          fi
          [[ -z "$PAGES_BASE_PATH" ]]

      - name: Download the fixed existing-release preservation archive
        shell: bash
        env:
          BASELINE_URL: https://github.com/savethebeesandseeds/caatuu/releases/download/caatuu-pages-v162/caatuu-pages-v162.tar
          BASELINE_ARCHIVE: artifacts/android/pages-input/caatuu-pages-v162.tar
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$BASELINE_ARCHIVE")"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --output "$BASELINE_ARCHIVE" \
            "$BASELINE_URL"

      - name: Create the validated Android release download plan
        shell: bash
        env:
          RELEASE_DESCRIPTOR: apps/android/tooling/pages-current-release.json
          RELEASE_PLAN: ${{ runner.temp }}/caatuu-pages-release-download-plan.json
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            node:24-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2 \
            node apps/android/tooling/pages-current-release.mjs download-plan \
              --descriptor "$RELEASE_DESCRIPTOR" > "$RELEASE_PLAN"
          jq -e '.schemaName == "caatuu-pages-release-download-plan" and (.assets | length > 0)' \
            "$RELEASE_PLAN" >/dev/null

      - name: Download and verify every retained Android release input
        shell: bash
        env:
          RELEASE_DESCRIPTOR: apps/android/tooling/pages-current-release.json
          RELEASE_PLAN: ${{ runner.temp }}/caatuu-pages-release-download-plan.json
        run: |
          set -euo pipefail
          while IFS= read -r record; do
            download_url="$(jq -er '.downloadUrl' <<<"$record")"
            source_path="$(jq -er '.sourcePath' <<<"$record")"
            expected_bytes="$(jq -er '.bytes' <<<"$record")"
            expected_sha256="$(jq -er '.sha256' <<<"$record")"
            [[ "$source_path" == artifacts/android/releases/* ]]
            [[ ! -e "$source_path" && ! -L "$source_path" ]]
            parent_path="$(dirname -- "$source_path")"
            ancestor="$parent_path"
            while [[ "$ancestor" != "." ]]; do
              [[ ! -L "$ancestor" ]]
              ancestor="$(dirname -- "$ancestor")"
            done
            mkdir -p -- "$parent_path"
            [[ -d "$parent_path" && ! -L "$parent_path" ]]
            temporary_path="${source_path}.download"
            [[ ! -e "$temporary_path" && ! -L "$temporary_path" ]]
            curl --fail --location --proto '=https' --tlsv1.2 \
              --retry 3 --retry-all-errors \
              --output "$temporary_path" \
              "$download_url"
            [[ -f "$temporary_path" && ! -L "$temporary_path" ]]
            [[ "$(stat -c '%s' -- "$temporary_path")" == "$expected_bytes" ]]
            read -r actual_sha256 _ < <(sha256sum -- "$temporary_path")
            [[ "$actual_sha256" == "$expected_sha256" ]]
            mv -- "$temporary_path" "$source_path"
          done < <(jq -c '.assets[]' "$RELEASE_PLAN")
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            node:24-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2 \
            node apps/android/tooling/pages-current-release.mjs verify \
              --descriptor "$RELEASE_DESCRIPTOR"

      - name: Build and validate the static bundle with every retained Android release
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            node:24-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2 \
            node apps/launcher/tooling/build-pages-site.mjs \
              --baseline-archive artifacts/android/pages-input/caatuu-pages-v162.tar \
              --current-release-descriptor apps/android/tooling/pages-current-release.json \
              --output artifacts/web/github-pages

      - name: Upload the exact static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: artifacts/web/github-pages
          retention-days: 1

  deploy:
    name: Deploy reviewed static site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a stale queued Pages deployment
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          mapfile -t remote_heads < <(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git")
          if (( ${#remote_heads[@]} != 1 )); then
            printf 'Expected exactly one remote branch before Pages deployment; found %s.\n' "${#remote_heads[@]}" >&2
            exit 1
          fi
          read -r remote_sha remote_ref <<<"${remote_heads[0]}"
          [[ "$remote_ref" == "refs/heads/main" ]]
          if [[ "$remote_sha" != "$EXPECTED_REVISION" ]]; then
            printf 'Refusing stale Pages deployment: main is %s, expected %s.\n' "$remote_sha" "$EXPECTED_REVISION" >&2
            exit 1
          fi

      - name: Deploy without a publication branch
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
