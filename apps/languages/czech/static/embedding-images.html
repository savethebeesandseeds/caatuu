<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5efe5">
    <title>Embedding Images - Caatuu Czech</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/caatuu-czech-512.png">
    <link rel="apple-touch-icon" href="icons/caatuu-czech-512.png">
    <script src="source/shared/course-profile.js?v=course-26"></script>
    <script src="/language-runtime/static/source/learning-profile.js?v=learning-5"></script>
    <script>
      try {
        const storedTheme = localStorage.getItem(window.CaatuuCourse.storage.theme) || "dark";
        document.documentElement.dataset.theme = ["light", "dark"].includes(storedTheme) ? storedTheme : "dark";
        const storedFontSize = localStorage.getItem(window.CaatuuCourse.storage.fontSize) || "largest";
        document.documentElement.dataset.fontSize = ["standard", "large", "largest"].includes(storedFontSize) ? storedFontSize : "largest";
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.fontSize = "largest";
      }
    </script>
  <script src="source/shared/runtime.js?v=runtime-41"></script>
  <script src="source/shared/semantic-learning.js?v=semantic-learning-7"></script>
  <link rel="stylesheet" href="/language-runtime/static/styles/caatuu-theme.css?v=theme-5">
  <link rel="stylesheet" href="/language-runtime/static/styles/caatuu-chrome.css?v=chrome-style-126">
    <link rel="stylesheet" href="source/features/embedding-images/embedding-images.css?v=embedding-images-8">
  </head>
  <body>
    <div class="embedding-images-page">
      <header class="app-header" data-caatuu-app-header data-caatuu-page-kicker="Developer" data-caatuu-page-title="Embedding images" data-caatuu-page-icon="/assets/icons/stats_icon.png"></header>

      <main class="embedding-images-main" aria-label="Embedding image debugger">
        <section class="embedding-images-panel" aria-labelledby="embeddingImagesTitle">
          <header class="embedding-images-head">
            <div>
              <p class="embedding-images-kicker">Developer</p>
              <h1 id="embeddingImagesTitle">Embedding images</h1>
            </div>
          </header>

          <form class="embedding-debug-tool embedding-images-tool" id="embeddingDebugForm">
            <label class="embedding-debug-field embedding-images-field" for="embeddingDebugText">
              <span>English prompt</span>
              <textarea id="embeddingDebugText" rows="3" spellcheck="false" placeholder="a macaw plays music">a macaw plays music</textarea>
            </label>
            <div class="embedding-debug-actions embedding-images-actions">
              <button class="embedding-debug-random" type="button" id="embeddingDebugRandom">Random</button>
              <button class="embedding-debug-run" type="submit" id="embeddingDebugRun">Search images</button>
              <span class="embedding-debug-status" id="embeddingDebugStatus" aria-live="polite">Ready</span>
            </div>
          </form>

          <div class="embedding-debug-results embedding-images-results" id="embeddingDebugResults" aria-live="polite"></div>
        </section>
      </main>

      <footer class="app-footer">
        <a class="footer-brand" href="https://www.waajacu.com/" rel="noopener">
          <img class="footer-logo" src="icons/caatuu-czech-512.png" alt="">
          <span>by Waajacu<sup class="brand-trademark" aria-hidden="true">™</sup></span>
        </a>
      </footer>
    </div>

    <nav
      class="bottom-app-nav"
      aria-label="Caatuu Czech sections"
      data-caatuu-bottom-nav
      data-active-section="settings"
      data-settings-target="openSettings"
    ></nav>

    <div data-caatuu-settings-panel hidden></div>

  <script src="/language-runtime/static/source/shell-policy.js?v=shell-policy-6"></script>
  <script src="/language-runtime/static/source/caatuu-chrome.js?v=chrome-124"></script>
    <script src="/language-runtime/static/source/maintenance-ui.js?v=maintenance-17"></script>
    <script type="module" src="source/features/embedding-images/embedding-images.js?v=embedding-images-2"></script>
  </body>
</html>
