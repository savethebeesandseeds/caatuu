<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5efe5">
    <title>Case Cosmos - Caatuu Czech</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/caatuu-czech-512.png">
    <link rel="apple-touch-icon" href="icons/caatuu-czech-512.png">
    <script src="source/shared/course-profile.js?v=course-62"></script>
    <script src="/language-runtime/static/source/learning-profile.js?v=learning-11"></script>
    <script src="/language-runtime/static/source/initial-theme.js?v=theme-3"></script>
  <script src="source/shared/runtime.js?v=runtime-41"></script>
    <script src="source/shared/semantic-learning.js?v=semantic-learning-8"></script>
    <link rel="stylesheet" href="/language-runtime/static/styles/caatuu-theme.css?v=theme-7">
  <link rel="stylesheet" href="/language-runtime/static/styles/caatuu-workspace.css?v=shell-96">
  <link rel="stylesheet" href="/language-runtime/static/styles/caatuu-chrome.css?v=chrome-style-138">
    <link rel="stylesheet" href="/language-runtime/static/styles/games/embedded-game-controls.css?v=embedded-game-controls-8">
    <link rel="stylesheet" href="source/games/case-cosmos/case-cosmos.css?v=case-cosmos-21">
  </head>
  <body class="games-page case-cosmos-page">
    <div class="app-shell">
      <header
        class="app-header"
        data-caatuu-app-header
        data-caatuu-page-kicker="Train"
        data-caatuu-page-title="Case Cosmos"
        data-caatuu-page-icon="/assets/planets/case-cosmos.png"
        data-caatuu-header-title="Case Cosmos"
        data-caatuu-header-back-label="Back to games"
        data-caatuu-header-back-href="index.html"
      ></header>

      <main class="workspace">
        <section class="view is-active" id="view-case-cosmos" aria-label="Train">
          <div class="case-cosmos-shell">
            <section class="case-cosmos-panel case-cosmos-boat-layout" id="caseCosmosPanel" aria-label="Case Cosmos" aria-busy="true">
              <div class="case-cosmos-controls" id="caseCosmosControls"></div>

              <div class="caatuu-game-robot-loading" id="caseCosmosLoading" role="status" aria-live="polite">
                <img class="caatuu-game-robot-loading-art" src="/assets/robots/robot%20(1).png" alt="" aria-hidden="true">
              </div>

              <article class="case-cosmos-board" id="caseCosmosBoard" aria-label="Case practice" hidden>
                <div class="case-cosmos-question" id="caseCosmosCaseNote">
                  <span class="case-cosmos-noun-label">Noun <strong id="caseCosmosNoun" lang="cs-CZ"></strong></span>
                  <h2 id="caseCosmosProposedCase"></h2>
                  <p id="caseCosmosCaseHint"></p>
                </div>
                <div class="case-cosmos-vessel" id="caseCosmosVessel">
                <img class="case-cosmos-boat" id="caseCosmosBoat" src="/assets/macaw/cases/floating_boat%20(1).png?v=cases-2" width="1216" height="1445" alt="" aria-hidden="true" draggable="false">
                <section class="case-cosmos-example" id="caseCosmosExample" tabindex="-1" aria-label="Sentence to review" aria-describedby="caseCosmosSentence caseCosmosTranslation caseCosmosProposedCase caseCosmosCaseHint">
                  <div class="case-cosmos-sentence-row">
                    <p class="case-cosmos-sentence" id="caseCosmosSentence" lang="cs-CZ"></p>
                  </div>
                  <p class="case-cosmos-translation" id="caseCosmosTranslation"></p>
                </section>
                <section class="case-cosmos-feedback" id="caseCosmosFeedback" role="status" aria-live="polite" aria-atomic="true" hidden>
                  <p id="caseCosmosFeedbackTitle"></p>
                  <h2 id="caseCosmosActualCase"></h2>
                  <p id="caseCosmosExplanation"></p>
                  <button class="case-cosmos-next" id="caseCosmosNext" type="button" hidden>Next <span aria-hidden="true">→</span></button>
                </section>
                </div>
                <div class="case-cosmos-actions">
                  <div class="case-cosmos-answers" role="group" aria-label="Does the highlighted noun form fit this sentence?" aria-describedby="caseCosmosProposedCase">
                    <button class="case-cosmos-answer" type="button" id="caseCosmosNo" aria-label="No" title="No — swipe left (N or 2)" aria-keyshortcuts="N 2" aria-pressed="false"><span aria-hidden="true">×</span></button>
                    <button class="case-cosmos-answer" type="button" id="caseCosmosYes" aria-label="Yes" title="Yes — swipe right (Y or 1)" aria-keyshortcuts="Y 1" aria-pressed="false"><span aria-hidden="true">✓</span></button>
                  </div>
                  <button class="case-cosmos-speak" id="caseCosmosSpeak" type="button" aria-label="Hear the sentence" hidden></button>
                </div>
              </article>

              <section class="case-cosmos-error" id="caseCosmosError" hidden>
                <img src="/assets/planets/case-cosmos.png" alt="" aria-hidden="true">
                <h1>Case Cosmos could not load</h1>
                <p id="caseCosmosErrorCopy"></p>
                <a href="index.html">Back to games</a>
              </section>
            </section>
            <div class="case-cosmos-info" id="caseCosmosInfo" hidden>
              <span class="case-cosmos-info-icon" aria-hidden="true">i</span>
              <p class="case-cosmos-swipe-help">Swipe left for No · right for Yes, or use the buttons.</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <a class="footer-brand" href="https://www.waajacu.com/" rel="noopener">
          <img class="footer-logo" src="icons/caatuu-czech-512.png" alt="">
          <span>by Waajacu<sup class="brand-trademark" aria-hidden="true">™</sup></span>
        </a>
      </footer>
    </div>

    <nav
      class="bottom-app-nav"
      aria-label="Caatuu Czech sections"
      data-caatuu-bottom-nav
      data-active-section="games"
      data-view-buttons="true"
      data-settings-target="openSettings"
    ></nav>

    <div data-caatuu-settings-panel hidden></div>

  <script src="/language-runtime/static/source/shell-policy.js?v=shell-policy-14"></script>
    <script type="module" src="/language-runtime/static/source/legacy-page-bootstrap.mjs?v=legacy-page-13" data-caatuu-feature-module="source/games/case-cosmos/case-cosmos.js?v=case-cosmos-25"></script>
  </body>
</html>
