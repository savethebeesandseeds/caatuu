<!doctype html>
<html lang="en" data-theme="dark" data-font-size="largest">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Conjugation Comet</title>
    <link rel="stylesheet" href="../styles/caatuu-theme.css?v=theme-6">
    <link rel="stylesheet" href="../styles/games/conjugation-comet.css?v=conjugation-comet-shared-1">
  </head>
  <body>
    <main class="conjugation-comet" id="conjugationCometRoot" aria-busy="true">
      <section class="conjugation-comet-loading" id="conjugationCometLoading" role="status" aria-live="polite">
        <img src="/assets/robots/robot%20(1).png" alt="" aria-hidden="true">
        <p>Preparing an authored verb challenge…</p>
      </section>

      <section class="conjugation-comet-game" id="conjugationCometGame" hidden>
        <header class="conjugation-comet-header">
          <div>
            <p class="conjugation-comet-kicker" id="conjugationCometKicker"></p>
            <h1 id="conjugationCometTitle"></h1>
            <p class="conjugation-comet-instruction" id="conjugationCometInstruction"></p>
          </div>
          <button
            class="conjugation-comet-hint-button"
            id="conjugationCometHintButton"
            type="button"
            aria-expanded="false"
            aria-controls="conjugationCometHint"
          ></button>
        </header>

        <aside class="conjugation-comet-hint" id="conjugationCometHint" role="note" hidden></aside>

        <section
          class="conjugation-comet-board conjugation-comet-meaning-board"
          id="conjugationCometMeaningBoard"
          hidden
        >
          <section class="conjugation-comet-column" aria-labelledby="conjugationCometMeaningTargetHeading">
            <h2 id="conjugationCometMeaningTargetHeading"></h2>
            <div class="conjugation-comet-anchor-card">
              <span class="conjugation-comet-card-label" id="conjugationCometInfinitiveLabel"></span>
              <strong id="conjugationCometLemma" lang="und"></strong>
              <small id="conjugationCometFamily"></small>
              <button class="conjugation-comet-speak" id="conjugationCometSpeakLemma" type="button">
                <span aria-hidden="true">🔊</span>
                <span></span>
              </button>
            </div>
          </section>
          <section class="conjugation-comet-column" aria-labelledby="conjugationCometMeaningBaseHeading">
            <h2 id="conjugationCometMeaningBaseHeading"></h2>
            <div class="conjugation-comet-card-list" id="conjugationCometMeaningOptions"></div>
          </section>
        </section>

        <section
          class="conjugation-comet-board conjugation-comet-forms-board"
          id="conjugationCometFormsBoard"
          hidden
        >
          <section class="conjugation-comet-column" aria-labelledby="conjugationCometTargetFormsHeading">
            <h2 id="conjugationCometTargetFormsHeading"></h2>
            <div class="conjugation-comet-card-list" id="conjugationCometTargetForms"></div>
          </section>
          <section class="conjugation-comet-column" aria-labelledby="conjugationCometBaseCuesHeading">
            <h2 id="conjugationCometBaseCuesHeading"></h2>
            <div class="conjugation-comet-card-list" id="conjugationCometBaseCues"></div>
          </section>
        </section>

        <footer class="conjugation-comet-footer">
          <p id="conjugationCometFeedback" role="status" aria-live="polite" aria-atomic="true"></p>
          <span id="conjugationCometProgress"></span>
          <button class="conjugation-comet-next" id="conjugationCometNext" type="button" hidden></button>
        </footer>
      </section>

      <section class="conjugation-comet-error" id="conjugationCometError" role="alert" hidden>
        <img src="/assets/planets/conjugation-comet.png" alt="" aria-hidden="true">
        <p class="conjugation-comet-kicker">Course content</p>
        <h1>Conjugation Comet could not start</h1>
        <p id="conjugationCometErrorText">Return to the planets and try again.</p>
      </section>
    </main>

    <script type="module" src="../source/games/conjugation-comet/conjugation-comet-host.mjs?v=conjugation-comet-shared-2"></script>
  </body>
</html>
