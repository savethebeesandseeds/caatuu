<!doctype html>
<html lang="en" data-theme="dark" data-font-size="largest">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Conjugation Comet</title>
    <link rel="stylesheet" href="../styles/caatuu-theme.css?v=theme-7">
    <link rel="stylesheet" href="../styles/games/embedded-game-controls.css?v=embedded-game-controls-8">
    <link rel="stylesheet" href="../styles/games/conjugation-comet.css?v=conjugation-comet-shared-4">
  </head>
  <body>
    <main class="conjugation-comet" id="conjugationCometRoot" aria-busy="true">
      <section class="caatuu-game-robot-loading" id="conjugationCometLoading" role="status"><img class="caatuu-game-robot-loading-art" src="/assets/robots/robot%20(1).png" alt="" aria-hidden="true"></section>
      <section class="conjugation-comet-game" id="conjugationCometGame" aria-labelledby="conjugationCometTitle" hidden>
        <h1 class="conjugation-comet-visually-hidden" id="conjugationCometTitle"></h1>
        <section class="conjugation-comet-play" id="conjugationCometPlay">
          <section class="conjugation-comet-card" id="conjugationCometCard" aria-describedby="conjugationCometQuestion">
            <header class="conjugation-comet-header">
          <article class="conjugation-comet-context" aria-labelledby="conjugationCometFormLemma">
            <div class="conjugation-comet-lemma-line"><span id="conjugationCometFormLemma" lang="und"></span><button class="conjugation-comet-speak" id="conjugationCometSpeakLemma" type="button"></button></div>
            <p id="conjugationCometMeaning"></p>
          </article>
          <div class="conjugation-comet-header-actions"><span class="conjugation-comet-visually-hidden" id="conjugationCometProgress"></span><div class="conjugation-comet-controls" id="conjugationCometControls"></div></div>
          <div class="conjugation-comet-dots conjugation-comet-visually-hidden" id="conjugationCometDots" aria-hidden="true"></div>
            </header>
            <div class="conjugation-comet-board" id="conjugationCometBoard">
            <div class="conjugation-comet-strand-controls">
              <div><span class="conjugation-comet-visually-hidden" id="conjugationCometTargetLabel"></span><button class="conjugation-comet-step" id="conjugationCometTargetPrev" data-helix-side="target" data-step="1" type="button"><span aria-hidden="true">↑</span></button><button class="conjugation-comet-step" id="conjugationCometTargetNext" data-helix-side="target" data-step="-1" type="button"><span aria-hidden="true">↓</span></button></div>
              <div><span class="conjugation-comet-visually-hidden" id="conjugationCometSubjectLabel"></span><button class="conjugation-comet-step" id="conjugationCometSubjectPrev" data-helix-side="subject" data-step="1" type="button"><span aria-hidden="true">↑</span></button><button class="conjugation-comet-step" id="conjugationCometSubjectNext" data-helix-side="subject" data-step="-1" type="button"><span aria-hidden="true">↓</span></button></div>
            </div>
            <div class="conjugation-comet-helix" id="conjugationCometHelix">
              <div class="conjugation-comet-pair-backgrounds" id="conjugationCometPairBackgrounds" aria-hidden="true"></div>
              <svg class="conjugation-comet-backbone" id="conjugationCometBackbone" viewBox="0 0 600 600" preserveAspectRatio="none" aria-hidden="true"></svg>
              <div class="conjugation-comet-jewels" id="conjugationCometJewels" aria-hidden="true"></div>
              <div id="conjugationCometRungStatus" aria-hidden="true"></div>
              <div class="conjugation-comet-strand conjugation-comet-strand-target" id="conjugationCometTargets" role="group" aria-labelledby="conjugationCometTargetLabel"></div>
              <div class="conjugation-comet-strand conjugation-comet-strand-subject" id="conjugationCometSubjects" role="group" aria-labelledby="conjugationCometSubjectLabel"></div>
            </div>
            </div>
            <button class="conjugation-comet-submit" id="conjugationCometSubmit" type="button" disabled><span id="conjugationCometSubmitLabel"></span><img src="/assets/icons/paper_plane_submit_ui.png" alt="" aria-hidden="true"></button>
          </section>
          <footer class="conjugation-comet-footer"><div class="conjugation-comet-messages"><div class="conjugation-comet-help" id="conjugationCometHelp"><span class="conjugation-comet-info-icon" aria-hidden="true">i</span><p id="conjugationCometQuestion"></p></div><p id="conjugationCometFeedback" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p></div></footer>
        </section>
        <section class="caatuu-game-robot-loading" id="conjugationCometTransition" role="status" hidden><img class="caatuu-game-robot-loading-art" src="/assets/robots/robot%20(1).png" alt="" aria-hidden="true"></section>
      </section>
      <dialog class="conjugation-comet-summary" id="conjugationCometSummary" aria-labelledby="conjugationCometSummaryTitle">
        <h2 id="conjugationCometSummaryTitle"></h2>
        <div id="conjugationCometSummaryPairs"></div>
        <button class="conjugation-comet-submit" id="conjugationCometSummaryNext" type="button"><span id="conjugationCometSummaryNextLabel"></span><img src="/assets/icons/paper_plane_submit_ui.png" alt="" aria-hidden="true"></button>
      </dialog>
      <section class="conjugation-comet-error" id="conjugationCometError" role="alert" hidden><img src="/assets/planets/conjugation-comet.png" alt="" aria-hidden="true"><h1>Conjugation Comet could not start</h1><p id="conjugationCometErrorText">Return to the planets and try again.</p></section>
    </main>
    <script type="module" src="../source/games/conjugation-comet/conjugation-comet-host.mjs?v=conjugation-comet-shared-13"></script>
  </body>
</html>
